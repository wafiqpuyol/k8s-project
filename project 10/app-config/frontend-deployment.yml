apiVersion: apps/v1
kind: Deployment
metadata: 
  name: project-10-frontend-deploy
  namespace: project-10
  labels:
    app: project-10-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: project-10-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: project-10-frontend
    spec:
      containers:
        - name: project-10-frontend
          image: wafiqhossain/project-10-frontend:v1.0
          imagePullPolicy: IfNotPresent
          # envFrom:
          #   - configMapRef:
          #       name: project-10-frontend-config
          env:
            - name: VITE_PORT
              value: "6869"

          ports:
            - containerPort: 80