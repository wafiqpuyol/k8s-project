apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-app-deployment
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # imagePullSecrets:
      #   - name: dockerhub-secret
      containers:
        - name: backend-app
          image: wafiqhossain/demo-app:v1.0
          ports:
            - containerPort: 3000